# Builds the Streamlit app, the Batch runner and the tesseract image.
#
# This workflow is deliberately left in place rather than shrunk: the Streamlit
# app and the tesseract are being kept (the tesseract is the natural substrate for
# the interactive fitting session in ergodicio/tsadar-app#36, and its imports still
# line up with tsadar main). The Thomson analysis browser is built by
# browser-image.yaml instead, so the two do not share tagging discipline.
#
# KNOWN HAZARD, not changed here: the three IMAGE_TAG values below are hardcoded
# (`...-v0.1.2`) and pushed with `docker push --all-tags`, so every push to main
# overwrites those same tags in ECR. That is the floating-tag failure mode
# continuum-infra's continuum.yaml header comment documents -- a pinned
# deployment can change underneath itself. browser-image.yaml takes the opposite
# approach: the tag comes from the VERSION file and the workflow refuses to
# overwrite an existing one. Applying the same discipline here means deciding what
# happens to the currently-deployed pins, which is a call for whoever owns those
# services rather than something to change in passing.

name: deploy

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy-tsadar-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and tag app image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: continuum
          IMAGE_TAG: tsadar-app-v0.1.2
        run: |
          docker build -f docker/app/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Push all images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: continuum
        run: |
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY
    
  deploy-tsadar-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and tag runner image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: continuum
          IMAGE_TAG: tsadar-runner-v0.1.2
        run: |
          docker build -f docker/runner/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Push all images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: continuum
        run: |
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

  deploy-tsadar-tesseract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and tag app image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: continuum
          IMAGE_TAG: tsadar-tesseract-v0.1.2
        run: |
          pip install tesseract-core
          tesseract --loglevel debug build tesseract/ --tag $IMAGE_TAG
          docker tag tsadar-tesseract:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push all images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: continuum
        run: |
          
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY