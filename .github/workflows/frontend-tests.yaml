# Checks for the analysis browser frontend (frontend/).
#
# Like browser-tests.yaml this is deliberately narrow; ergodicio/tsadar-app#34
# owns packaging and CI properly and will extend or absorb both.
#
# The client-in-sync job is the one that matters: it regenerates the OpenAPI
# document from the FastAPI app and the TypeScript types from that document, then
# fails on any diff. Without it the generated client silently rots the first time
# a response model changes.
name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/dump_openapi.py"
      - "tsadar_browser/**"
      - ".github/workflows/frontend-tests.yaml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "scripts/dump_openapi.py"
      - "tsadar_browser/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  client-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-browser-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        # Needed because the schema is dumped from the real FastAPI app rather
        # than from a checked-in copy that could drift on its own.
        run: pip install -r requirements-browser-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate the schema and client, and fail on any diff
        working-directory: frontend
        run: npm run check:client

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::The generated API client is out of date."
          echo "Run 'npm run gen' in frontend/ and commit the result."
